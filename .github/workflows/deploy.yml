# Deploy Origin Cost Desk via SSH (GitHub Actions).
# Public app port on host: 34344 (not an SSH secret).
#
# Required secrets (Repo → Settings → Secrets and variables → Actions):
#   DEPLOY_HOST
#   DEPLOY_SSH_PORT   (SSH port from Teddy — not 34344)
#   DEPLOY_USER
#   DEPLOY_SSH_KEY    (preferred)  OR  DEPLOY_PASSWORD
#
# Never commit passwords or private keys.
# Never paste server passwords into AI tools (Cursor, etc.).
# Never let AI agents SSH into the company server.

name: Deploy devops

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-devops
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check deploy secrets
        run: |
          missing=0
          [ -z "${{ secrets.DEPLOY_HOST }}" ] && echo "Missing DEPLOY_HOST" && missing=1
          [ -z "${{ secrets.DEPLOY_SSH_PORT }}" ] && echo "Missing DEPLOY_SSH_PORT" && missing=1
          [ -z "${{ secrets.DEPLOY_USER }}" ] && echo "Missing DEPLOY_USER" && missing=1
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ] && [ -z "${{ secrets.DEPLOY_PASSWORD }}" ]; then
            echo "Missing auth: set DEPLOY_SSH_KEY (preferred) or DEPLOY_PASSWORD"
            missing=1
          fi
          [ "$missing" = "1" ] && exit 1
          echo "Deploy secrets present (values hidden)."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail
            export PORT=34344
            export APP_DIR="$HOME/WAC_Quoto-Simulator"
            export REPO="https://github.com/hyunseook0606-dev/WAC_Quoto-Simulator.git"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO" "$APP_DIR"
            fi
            cd "$APP_DIR"
            bash scripts/deploy-cloud.sh
            echo "==> verify local"
            curl -sf "http://127.0.0.1:${PORT}/api/health"
            echo
            HTML="$(curl -sf "http://127.0.0.1:${PORT}/" | head -c 800 || true)"
            echo "$HTML" | head -c 200
            echo
            if echo "$HTML" | grep -q '/src/main.tsx'; then
              echo "ERROR: port ${PORT} is serving Vite DEV index (/src/main.tsx), not dist/"
              exit 1
            fi
            if ! echo "$HTML" | grep -q '/assets/'; then
              echo "ERROR: port ${PORT} response has no /assets/ bundle — production build not served"
              exit 1
            fi
            echo "OK — open http://devops.wactracking.com:${PORT}/"
            echo "    or http://devops.wactracking.com:${PORT}/origin-cost-desk"
