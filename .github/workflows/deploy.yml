# Deploy Origin Cost Desk to company devops via SSH + password secret.
# URL: http://devops.wactracking.com:34344/origin-cost-desk
#
# Required GitHub Actions secret (only this one must be set):
#   DEPLOY_PASSWORD = SSH password for userinternship
#
# Do not commit the password. Do not paste it into AI tools.

name: Deploy devops

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-devops
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check password secret is set
        run: |
          if [ -z "${{ secrets.DEPLOY_PASSWORD }}" ]; then
            echo "Missing secret DEPLOY_PASSWORD. Add it in Repo Settings → Secrets → Actions."
            exit 1
          fi
          echo "DEPLOY_PASSWORD is set (value hidden)."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: devops.wactracking.com
          username: userinternship
          port: 34343
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail
            export PORT=34344
            export APP_DIR="$HOME/WAC_Quoto-Simulator"
            export REPO="https://github.com/hyunseook0606-dev/WAC_Quoto-Simulator.git"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO" "$APP_DIR"
            fi
            cd "$APP_DIR"
            bash scripts/deploy-cloud.sh
            curl -sf "http://127.0.0.1:${PORT}/api/health"
            echo
            echo "OK — open http://devops.wactracking.com:${PORT}/origin-cost-desk"
