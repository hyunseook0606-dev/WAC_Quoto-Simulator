# Deploy Origin Cost Desk to company devops host via SSH.
# Target: http://devops.wactracking.com:34344/origin-cost-desk
#
# Required secrets:
#   DEPLOY_HOST       devops.wactracking.com
#   DEPLOY_SSH_PORT   SSH port (e.g. 34343) — NOT 34344
#   DEPLOY_USER       SSH username
#   DEPLOY_PASSWORD   SSH password
#
# Optional:
#   DEPLOY_SSH_KEY    private key (if set, used instead of password)
#   DEPLOY_WEB_PORT   default 34344
#   DEPLOY_APP_DIR    default $HOME/WAC_Quoto-Simulator
#
# Never commit passwords. Prefer GitHub Secrets only.

name: Deploy devops

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-devops
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail
            export PORT="${{ secrets.DEPLOY_WEB_PORT }}"
            if [ -z "${PORT:-}" ]; then
              export PORT=34344
            fi
            export APP_DIR="${{ secrets.DEPLOY_APP_DIR }}"
            if [ -z "${APP_DIR:-}" ]; then
              export APP_DIR="$HOME/WAC_Quoto-Simulator"
            fi
            export REPO="https://github.com/hyunseook0606-dev/WAC_Quoto-Simulator.git"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO" "$APP_DIR"
            fi
            cd "$APP_DIR"
            bash scripts/deploy-cloud.sh
            curl -sf "http://127.0.0.1:${PORT}/api/health"
            echo
            echo "OK — open http://devops.wactracking.com:${PORT}/origin-cost-desk"
